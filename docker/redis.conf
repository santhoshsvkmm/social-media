# Redis Configuration for WoWonder

# Server
port 6379
bind 0.0.0.0
timeout 0
tcp-backlog 511
tcp-keepalive 300

# Database
databases 16
dbfilename dump.rdb
dir /data

# Persistence
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# Append-only file (AOF) for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile /var/log/redis/redis.log

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Event notification
notify-keyspace-events ""

# Lua scripting
lua-time-limit 5000

# Client handling
max-clients 10000

# Security (optional - no password by default for development)
# requirepass yourpassword

# AOF configuration
aof-rewrite-incremental-fsync yes
